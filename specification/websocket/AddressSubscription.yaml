description: >-
  One ADAMANT address or a list of addresses. Values are validated and normalized to uppercase.
oneOf:
  - $ref: '../common/properties/AdamantAddress.yaml'
  - type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: '../common/properties/AdamantAddress.yaml'
example:
  - U1234567890123456
  - U6543210987654321
